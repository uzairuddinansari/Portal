<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            padding: 40px 20px;
        }

        .attendance {
            max-width: 900px;
            margin: auto;
        }

        .top {
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
        }

        .top h1 {
            margin-bottom: 20px;
        }

        .student-info {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .student-box {
            flex: 1;
            padding: 18px;
            background: #f5f5f5;
            border-radius: 12px;
        }

        .student-box p {
            font-size: 13px;
            color: #777;
            margin-bottom: 5px;
        }

        .student-box h2 {
            font-size: 22px;
        }

        #attendanceForm {
            display: flex;
            gap: 10px;
        }

        #password {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        #passBtn {
            padding: 13px 25px;
            border: none;
            background: #222;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .calendar {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header button {
            padding: 9px 15px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 7px;
            cursor: pointer;
        }

        .calendar-header h2 {
            font-size: 22px;
        }

        .weekdays,
        #days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .weekday {
            text-align: center;
            font-weight: bold;
            padding: 10px 0;
            font-size: 13px;
        }

        .day {
            min-height: 90px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            position: relative;
            background: #fff;
        }

        .date {
            font-weight: bold;
        }

        .status {
            display: block;
            margin-top: 25px;
            font-size: 13px;
        }

        .present {
            border: 2px solid green;
        }

        .present .status {
            color: green;
            font-weight: bold;
        }

        .today {
            background: #f0f0f0;
        }

        .empty {
            border: none;
            background: transparent;
        }

        @media (max-width: 650px) {
            .student-info {
                flex-direction: column;
            }

            .weekdays,
            #days {
                gap: 4px;
            }

            .day {
                min-height: 70px;
                padding: 6px;
            }

            .status {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="attendance">

        <div class="top">

            <h1>Class Attendance</h1>

            <div class="student-info">

                <div class="student-box">
                    <p>Student Name</p>
                    <h2 id="studentName"></h2>
                </div>

                <div class="student-box">
                    <p>Roll Number</p>
                    <h2 id="studentRoll"></h2>
                </div>

            </div>

            <form id="attendanceForm">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Sign"
                    required
                >

                <button type="submit" id="passBtn">
                    Pass
                </button>
                <button type="submit" id="absent">
                    Absent
                </button>

            </form>

        </div>


        <div class="calendar">

            <div class="calendar-header">

                <button id="previousMonth">
                    Previous
                </button>

                <h2 id="month"></h2>

                <button id="nextMonth">
                    Next
                </button>

            </div>

            <div class="weekdays">
                <div class="weekday">Sun</div>
                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
            </div>

            <div id="days"></div>

        </div>

    </div>

    <script type="module" src="./Attendance.js"></script>

</body>
</html>
