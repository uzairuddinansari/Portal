<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login-container">

    <div class="login-form">

        <div class="form-content">

            <span class="small-title">Teacher Portal</span>

            <h1>TEACHER LOGIN</h1>

            <p class="subtitle">
                Login to manage your Class system
            </p>

            <form id="admitForm">

                <label for="Admitname">Teacher Name</label>
                <input
                    type="text"
                    id="Admitname"
                    name="Admitname"
                    placeholder="Enter your username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>

    <div class="login-image">
        <img src="./img/wander-fleur-1lmGTHdQdjM-unsplash.jpg" alt="School">
    </div>

</div>

<script type="module" src="managment.js"></script>
<script type="module" src="login.js"></script>

</body>
</html>
